; supervisord.conf for openhost-lila.
;
; Differences from the upstream lila-docker mono image's
; /etc/supervisor/conf.d/supervisord.conf:
;
;   * Add `openhost-init` as a oneshot program that runs before
;     mongo (autostart yes, no autorestart, exit-after-success
;     semantics): copies /seeded → $OPENHOST_APP_DATA_DIR/mongodb
;     on first boot, generates the admin password, and writes
;     LILA_URL / LILA_DOMAIN into /etc/environment-openhost-lila
;     so subsequent supervisord-child env-loads pick them up.
;
;   * mongo is started against $OPENHOST_APP_DATA_DIR/mongodb
;     instead of /seeded, and only after openhost-init exits.
;
;   * redis is given --appendonly yes plus a --dir pointing at
;     $OPENHOST_APP_DATA_DIR/redis so its appendonly file
;     survives container restarts.
;
;   * Add `lila-fishnet` and `fishnet-worker` as long-running
;     programs so AI / "play with the computer" games get opponent
;     moves.  lila-fishnet is the Scala move-broker (loopback
;     :9665, bridges Redis fishnet-in/out to an HTTP queue); the
;     fishnet-worker is the Stockfish client that polls it.
;
;   * Add `auth-proxy` as a long-running program listening on
;     0.0.0.0:8080.  Caddy moves to loopback 8081 (see
;     mono.Caddyfile).
;
;   * `lila-ws` and `lila` configurations are unchanged from the
;     upstream conf.

[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes = 0
; supervisord's own environment doesn't pick up runtime env vars
; reliably across container restarts; openhost-init writes
; /etc/environment-openhost-lila and we source it from each
; child program's command (see [program:lila] etc).

; Oneshot init: copies /seeded → persistent dir on first boot,
; generates admin creds, writes LILA_URL/LILA_DOMAIN.  Any other
; program with `priority` >= 50 starts after this one finishes
; (priority defaults to 999, lower = earlier).  We use
; `startsecs=0` plus `autorestart=false` plus `exitcodes=0` so
; supervisord considers the program "successful" the instant the
; script exits 0 — i.e. oneshot semantics.
[program:openhost-init]
command=/opt/openhost-lila/openhost-init.sh
priority=10
autostart=true
autorestart=false
startsecs=0
startretries=0
exitcodes=0
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stopwaitsecs=10
; Note: supervisord does NOT enforce hard dependencies between
; programs; the `priority` values below are only a soft ordering
; hint, so mongo / redis / caddy / lila-ws / lila can be spawned
; before the openhost-init oneshot has written
; /etc/environment-openhost-lila.  We defend against that in each
; downstream program's command: instead of sourcing the env file
; directly, they all source /opt/openhost-lila/source-env.sh, which
; WAITS (bounded, ~60s) for the env file to appear and then sources
; it — and exits non-zero (fail-loud, container goes unhealthy) if
; it never does.  This matters most for lila-ws: sourcing the file
; is what overrides the upstream image's baked-in
; LILA_URL=http://localhost:8080 with the real public origin, which
; lila-ws bakes into its WebSocket CSRF/Origin check.  Starting
; lila-ws before the file exists (the old `. file && cmd; ...`
; prelude did exactly this, because a failed `.` only short-circuits
; the first `&&` and later `;` statements still ran with the stale
; env) left it with the wrong csrf.origin and made it 403 every
; socket handshake — the "Reconnecting…" hang.  See source-env.sh.

[program:mongo]
; Pointed at the persistent dir.  --bind_ip 127.0.0.1 keeps
; mongod loopback-only inside the container.  Auth is off
; (the MongoDB 4+ default when --auth is not passed): the only
; thing inside the container that talks to mongod is lila
; itself, and an attacker who can reach loopback inside the
; container has already broken the container boundary.
command=bash -c 'set -a; . /opt/openhost-lila/source-env.sh; set +a; exec mongod --bind_ip 127.0.0.1 --logpath /var/log/mongodb/mongod.log --dbpath "${OPENHOST_LILA_MONGO_DBPATH}"'
priority=50
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:redis]
; appendonly yes makes redis write a journal that survives a
; container kill -9.  --dir is where the AOF file goes.
command=bash -c 'set -a; . /opt/openhost-lila/source-env.sh; set +a; exec redis-server --bind 127.0.0.1 --appendonly yes --dir "${OPENHOST_LILA_REDIS_DIR}"'
priority=50
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:caddy]
; Caddy on loopback 8081 — auth_proxy occupies 0.0.0.0:8080.
command=bash -c 'set -a; . /opt/openhost-lila/source-env.sh; set +a; exec caddy run --config /mono.Caddyfile'
priority=100
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:lila-ws]
; lila-ws is the WebSocket sidecar (loopback :9664) that powers
; all live game streams; without it every /socket/v6 connection
; hangs and the client shows "Reconnecting…" forever after the
; first move.
;
; JAVA_OPTS is overridden to 1 GiB (see the note on lila-fishnet):
; the image's baked-in -Xms4g -Xmx4g applies to every JVM that
; inherits it, and three 4 GiB heaps do not fit in an 8 GiB
; container.  lila-ws holds socket state, not game history, so 1 GiB
; is generous for a single-owner instance.
;
; TWO bugs are fixed here; both manifested as the client hanging
; on "Reconnecting…" after a move (no live socket).
;
; (A) Startup ordering.  lila-ws is started with
; `-Dcsrf.origin="${LILA_URL}"`, and lila-ws does an EXACT-string
; match of the WebSocket handshake's Origin header against that
; value; any mismatch is a 403 and the socket never opens.
; ${LILA_URL} must therefore be the *public* origin that
; openhost-init computes into /etc/environment-openhost-lila.  The
; upstream image bakes its own `LILA_URL=http://localhost:8080`
; into the container ENV, so if lila-ws starts before openhost-init
; has written the env file, it silently comes up with
; `-Dcsrf.origin=http://localhost:8080` and rejects every real
; browser socket.  We now source the env file via
; /opt/openhost-lila/source-env.sh, which WAITS for the file and
; fails loud if it never appears (see that script) rather than
; falling through to the stale baked-in value.
;
; (B) Launcher path.  Upstream lila-docker's build layout for
; lila-ws is NOT stable across image rebuilds: it used to emit the
; sbt-native-packager launcher at
;   /lila-ws/target/universal/stage/bin/lila-ws
; but current images build lila-ws with scala-cli, which nests the
; launcher under a scala-version-stamped directory
;   /lila-ws/target/out/jvm/scala-<X.Y.Z>/lila-ws/universal/stage/bin/lila-ws
; (e.g. scala-3.8.4).  Hard-coding either path is a landmine — the
; old path 127s ("No such file or directory") on today's image, and
; hard-coding the scala-3.8.4 path would break on the next Scala
; bump.  So we glob for the launcher under both layouts, newest
; scala dir first (newest scala-<ver> wins via `sort -V | tail -1`),
; then the legacy sbt path; `break` on the first executable match.
; If none exists we fail loud (so the container goes unhealthy
; rather than silently serving a WS-less "Reconnecting" UI).
command=bash -c 'set -a; . /opt/openhost-lila/source-env.sh; set +a; export JAVA_OPTS="-Xms256m -Xmx1g"; ws_bin=""; scala_cli_bin="$(ls -d /lila-ws/target/out/jvm/scala-*/lila-ws/universal/stage/bin/lila-ws 2>/dev/null | sort -V | tail -1)"; for c in "$scala_cli_bin" /lila-ws/target/universal/stage/bin/lila-ws; do if [ -n "$c" ] && [ -x "$c" ]; then ws_bin="$c"; break; fi; done; if [ -z "$ws_bin" ]; then echo "[lila-ws] FATAL: could not locate lila-ws launcher under /lila-ws/target (checked scala-cli target/out and legacy target/universal layouts)" >&2; exit 1; fi; echo "[lila-ws] using launcher: $ws_bin csrf.origin=${LILA_URL}"; exec "$ws_bin" -Dcsrf.origin="${LILA_URL}"'
priority=200
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:lila]
; sleep 5 to give mongo time to bind; otherwise identical to
; upstream.  reset-db.sh is destructive (it passes --drop-db to
; spamdb), so we only run it on the very first boot, when
; openhost-init copied /seeded into the persistent dir but
; lila has not yet had a chance to write user state.
; OPENHOST_LILA_FRESHLY_SEEDED is set to "1" by openhost-init
; on first boot only.  On every subsequent boot it's "0" and we
; skip reset-db.sh entirely so operator user accounts and games
; survive.
command=bash -c 'set -a; . /opt/openhost-lila/source-env.sh; set +a; sleep 8 && if [[ "${OPENHOST_LILA_FRESHLY_SEEDED}" = "1" ]]; then echo "[lila] freshly seeded; running reset-db.sh"; /scripts/reset-db.sh; else echo "[lila] persistent DB already initialised; skipping reset-db.sh"; fi && exec /lila/target/universal/stage/bin/lila -Dconfig.file="/lila/conf/mono.conf" -Dlogger.file="/lila/conf/logger.dev.xml"'
priority=200
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:lila-fishnet]
; The move-broker that makes AI / "play with the computer" games
; work.  Lila publishes AI move requests to Redis (channels
; fishnet-in / fishnet-out); lila-fishnet consumes them and exposes
; an HTTP work queue on 127.0.0.1:9665/fishnet for Stockfish workers.
; Without it, an AI game's board renders but the computer never
; moves (lila's own /fishnet refuses move work by design).
;
; Config via env (see lila-fishnet AppConfig.scala): defaults are
; HTTP_HOST=0.0.0.0 HTTP_PORT=9665 REDIS_HOST=127.0.0.1
; REDIS_PORT=6379 — all correct for our single-container loopback
; setup, so we only pin HTTP_HOST to loopback for defence in depth.
; JAVA_HOME points at the JDK we copied alongside the app.
;
; JAVA_OPTS: the upstream mono image bakes JAVA_OPTS="-Xms4g -Xmx4g"
; into the image ENV, and it applies to EVERY JVM that inherits it —
; lila, lila-ws and lila-fishnet.  Three JVMs each *committing* 4 GiB
; (-Xms is a floor, not a ceiling) is 12 GiB of heap in an 8 GiB
; container: the cgroup sat at 99.98% of memory.max, had tripped the
; limit thousands of times, and only stayed alive by pushing ~2 GiB to
; swap.  lila-fishnet is a small Redis→HTTP work broker; 512 MiB is
; ample.  Overriding JAVA_OPTS per program is what keeps the 4 GiB
; reservation exclusive to lila itself (which upstream really does
; need it for).
command=bash -c 'set -a; . /opt/openhost-lila/source-env.sh; set +a; export JAVA_HOME=/opt/lila-fishnet-java PATH=/opt/lila-fishnet-java/bin:$PATH JAVA_OPTS="-Xms128m -Xmx512m" HTTP_HOST=127.0.0.1 HTTP_PORT=9665 REDIS_HOST=127.0.0.1 REDIS_PORT=6379 && exec /opt/lila-fishnet/bin/lila-fishnet'
priority=200
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:fishnet-worker]
; The Stockfish worker that computes AI opponent moves.  Polls
; lila-fishnet's HTTP queue on loopback :9665.  --no-conf keeps it
; fully non-interactive; lila runs fishnet.offline_mode = true
; (base.conf) so no registered key is required.  We pin a modest
; core count so a busy instance doesn't starve the lila / lila-ws
; JVMs; AI opponents don't need deep search.  sleep to let
; lila-fishnet bind its HTTP port first (worker retries on its own
; via --max-backoff, but this avoids a noisy initial error burst).
command=bash -c 'sleep 20 && exec /usr/local/bin/fishnet --no-conf --no-stats-file --endpoint http://127.0.0.1:9665/fishnet --cores 2 --max-backoff 5'
priority=300
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:fishnet-analysis-worker]
; The Stockfish worker that computes GAME ANALYSIS ("Request a
; computer analysis" on a finished game's analysis board).
;
; This is a SEPARATE queue from AI opponent moves, and it needs its
; own worker.  Lila splits the two:
;
;   * move work  → published to Redis, brokered by lila-fishnet,
;                  served over HTTP on :9665 (the worker above).
;                  Lila's own /fishnet refuses move work outright
;                  ("Can't acquire a move directly on lichess!").
;   * analysis work → queued inside lila itself and handed out by
;                  lila's OWN /fishnet endpoint on :9663.
;
; With only the :9665 worker running, analysis requests were accepted
; (POST /<gameId>/request-analysis → 204) and then queued forever: the
; UI showed a spinner indefinitely and the PGN never gained a single
; [%eval] tag, because nothing was polling lila's analysis queue.
; Pointing a second worker at lila directly drains it.
;
; We go through Caddy on :8081 rather than straight to lila on :9663, and
; that detail is load-bearing.  Before acquiring, the worker calls
; GET /fishnet/status to see how big the queue is, and it uses the answer
; to decide whether to ask for high-priority (user-requested) work or only
; low-priority "slow" work.  Talking to lila directly means the request
; carries a loopback Host header, which does not match lila's configured
; net.domain, so lila answers /fishnet/status with a 301 to its canonical
; domain.  The worker does not follow that redirect, sees no backlog, and
; therefore polls forever with ?slow=true — which lila answers 204,
; because a "Request a computer analysis" job is user-priority, not slow.
; The result is a queue that never drains.  Caddy rewrites Host to
; $LILA_DOMAIN (see mono.Caddyfile), so through it /fishnet/status returns
; 200 with real counts, the worker switches to ?slow=false, and the job is
; picked up.
;
; No API key: lila runs fishnet.offline_mode = true (base.conf), which
; authenticates any client, so /fishnet/acquire accepts our requests.
; --cores 1 (the move worker already has 2 of the container's 4) so a
; long analysis can never starve live AI games, which are latency
; sensitive in a way that a background analysis is not.  Longer sleep
; than the move worker because lila's JVM takes 60-120s to bind.
command=bash -c 'sleep 90 && exec /usr/local/bin/fishnet --no-conf --no-stats-file --endpoint http://127.0.0.1:8081/fishnet --cores 1 --max-backoff 30'
priority=300
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:auth-proxy]
; Listens on 0.0.0.0:8080 (the OpenHost-routed port) and
; reverse-proxies to Caddy on loopback 8081.  The app is public, so
; anonymous visitors pass through to Lila as guests.  On an owner
; request (X-OpenHost-Is-Owner: true) that lacks an authenticated
; lila2 session (no sessionId key — covers missing, logged-out, and
; anonymous-guest cookies), it POSTs admin credentials to /login,
; captures Set-Cookie, and 302's the browser back with the cookie set.
command=bash -c 'set -a; . /opt/openhost-lila/source-env.sh; set +a; exec python3 /opt/openhost-lila/auth_proxy.py'
priority=300
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
