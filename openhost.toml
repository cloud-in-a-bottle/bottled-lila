[app]
name = "lila"
version = "0.1.0"
description = "Lichess (Lila) chess server, packaged for Cloud in a Bottle with one-click SSO.  A self-hosted Lichess instance that lets the Cloud in a Bottle zone owner play, study, do puzzles, and use Lichess's full feature set without ever seeing Lila's native login page.  Bundles MongoDB, Redis, lila, lila-ws, and Caddy in a single container; pre-seeded with a few hundred sample users so the lobby and tournaments aren't empty."
authors = ["Andrew Laack <andrew@laack.co>"]

[runtime.container]
# auth_proxy listens on 8080 (the OpenHost-routed port).  Inside
# the container, Caddy is moved off 8080 to 127.0.0.1:8081 (so
# the auth_proxy can sit in front).  Caddy then routes:
#   * /socket/v* (websockets) → 127.0.0.1:9664 (lila-ws)
#   * everything else        → 127.0.0.1:9663 (lila)
image = "Dockerfile"
port = 8080

[routing]
# Lila's /login GET is the unauth landing form; we deliberately
# do NOT route the OpenHost healthcheck to a Lila endpoint
# because Lila takes 60-120s to fully boot (it's the JVM, with
# the MongoDB seeding step running ahead of it).  The auth_proxy
# itself returns 200 on /healthz the moment it binds, well before
# the upstream is up — this is the same pattern openhost-joplin
# and openhost-bookstack use to satisfy OpenHost's "container
# alive" probe without flapping during cold start.
health_check = "/healthz"
# The whole app is public so shareable Lichess links work for
# people who are NOT the OpenHost zone owner.  Lichess is a
# multiplayer/social chess server: the owner sends out an "open
# challenge" link (``/challenge/<id>``), a live game link
# (``/<gameId>``), a study, or a tournament URL, and the
# recipient must be able to open it WITHOUT an OpenHost account.
#
# Why ``["/"]`` rather than an enumerated allow-list?  OpenHost's
# router path matcher is a *prefix* match, and Lila's most
# important shareable URLs live at the bare domain root — a game
# is ``/<8-char-gameId>``, playing as a color is
# ``/<12-char-fullId>``, an open challenge is ``/challenge/<id>``.
# There is no prefix that isolates those bare-token game URLs
# from ``/`` itself, so an enumerated list can't cover them.
# Overleaf (link-shared docs) and Forgejo take the same
# ``public_paths = ["/"]`` approach for exactly this reason.
#
# This does NOT weaken owner SSO or expose admin surfaces:
#
#   * The OpenHost router still verifies the owner's zone_auth
#     and stamps ``X-OpenHost-Is-Owner: true`` on the owner's
#     requests even on public paths.  The auth_proxy auto-logs
#     the owner in as admin exactly as before (its trigger is the
#     owner header, not the path).
#   * Anonymous visitors arrive with no owner header, so the
#     auth_proxy never auto-logs them in — it forwards them to
#     Lila, which serves them as an ordinary anonymous Lichess
#     guest (view games, accept open challenges, play as a guest
#     via Lila's AnonCookie).
#   * Admin / moderation pages are gated by Lila's own ROLE_ADMIN
#     authorization, which anonymous guests do not have; Lila
#     denies them regardless of the OpenHost gate.
#
# /healthz stays first for clarity (answered locally by the
# auth_proxy).  /login, /socket/, /assets/, /api/socket remain
# meaningful for anonymous guests (login form fallback, live
# game WebSocket, static assets, socket handshake) and are
# subsumed by "/" but kept documented here.
public_paths = [
    "/",
    "/healthz",
    "/login",
    "/socket/",
    "/assets/",
    "/api/socket",
]

[resources]
# Lila is a JVM monster.  -Xmx4g is what the upstream mono image
# pins (see lila-docker/docker/mono.Dockerfile).  Plus MongoDB,
# Redis, lila-ws (another JVM, smaller heap), Caddy, and now
# lila-fishnet (a third, small JVM) + a Stockfish worker (2 cores
# of native search during AI games).  Bump to 8 GiB / 4 CPUs so the
# fishnet worker's Stockfish search doesn't starve the lila /
# lila-ws JVMs while an AI game is in progress.  The OpenHost host
# on andrew-1 has 31 GiB so this is comfortable.
memory_mb = 8192
cpu_millicores = 4000

[data]
# Persistent state under /data/app_data/lila/:
#   * mongodb/             — MongoDB data dir.  Seeded from the
#                            image's /seeded on first boot, then
#                            grown by Lila's writes.
#   * redis/               — Redis appendonly file (mostly cache;
#                            losing it survives without data
#                            loss but trips a long re-warm).
#   * admin-credentials.txt — generated admin password the
#                             auth_proxy uses for auto-login
#                             (chmod 0600).
app_data = true
# Lila and lila-ws spill JVM-side scratch (compiled templates,
# uploaded asset thumbnails) to /tmp; let it use the OpenHost
# temp dir.
app_temp_data = true
